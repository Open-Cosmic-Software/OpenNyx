name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - "shell/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build-win64:
    name: Build OpenNyx (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The extracted CEF binary distribution is ~1.5 GB; cache it so
      # subsequent builds skip the download + extraction.
      - name: Cache CEF binary distribution
        uses: actions/cache@v4
        with:
          path: shell/third_party/cef
          key: cef-win64-150.0.11

      # Sets up the MSVC (cl.exe) environment regardless of the installed
      # Visual Studio version on the runner image.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake + Ninja, MSVC x64)
        run: cmake -S shell -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --target opennyx --parallel

      - name: Prepare artifact
        shell: pwsh
        run: |
          $out = "build/Release"
          if (-not (Test-Path "$out/opennyx.exe")) {
            Write-Error "opennyx.exe not found in $out"
            Get-ChildItem -Recurse build -Filter *.exe | Select-Object FullName
            exit 1
          }
          # Remove the downloaded CEF archive leftovers if any ended up in out dir.
          Get-ChildItem $out
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$out/*" dist/
          # Drop debug-only leftovers to keep the zip lean.
          Remove-Item -ErrorAction SilentlyContinue dist/*.pdb, dist/*.lib, dist/*.exp

      # EasyPrivacy ships as a separate data file next to the exe (not part of
      # the MIT source). Fetched at BUILD time, so the browser itself never
      # downloads it. Fail the build if it is missing or not the real list.
      - name: Bundle EasyPrivacy blocklist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/blocklists -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://easylist.to/easylist/easyprivacy.txt" -OutFile dist/blocklists/easyprivacy.txt
          $t = Get-Content dist/blocklists/easyprivacy.txt -Raw
          if ($t -notmatch "! Title: EasyPrivacy") { Write-Error "not the EasyPrivacy list"; exit 1 }
          if ($t -notmatch "\|\|trackersimulator\.org\^") { Write-Error "EasyPrivacy without trackersimulator.org"; exit 1 }
          $n = ([regex]::Matches($t, "(?m)^\|\|[a-z0-9.-]+\^")).Count
          if ($n -lt 10000) { Write-Error "only $n host rules"; exit 1 }
          Write-Host "EasyPrivacy: $n host rules"
          @"
          EasyPrivacy (https://easylist.to/) by The EasyList authors.
          Dual licensed under GPL v3 (or later) and Creative Commons
          Attribution-ShareAlike 3.0 Unported. Shipped unmodified as a separate
          data file; OpenNyx itself is MIT licensed.
          Updates: replace this file with a newer easyprivacy.txt.
          "@ | Set-Content dist/blocklists/EASYPRIVACY-LICENSE.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenNyx-win64
          path: dist/
          if-no-files-found: error
          compression-level: 6
